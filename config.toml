# chiplet-compiler configuration (tracked defaults).
# Machine-specific paths and overrides go in config.local.toml (untracked; see config.local.toml.example).
# Every pass reads only [passes.<pass>] and [passes.<pass>.resources]. Unknown keys are an error.
# Merge order: built-in defaults < config.toml < config.local.toml < `chipc --set key=value`.
# A [passes.<name>] section whose pass is not implemented yet only warns: the sections of planned passes
# document their intended keys and may still change.

[pipeline]
max_parallel_passes = 2          # passes running at once (subject to the budgets below)
targets = ["hello_b", "hello_c"] # passes to reach; dependencies are pulled in automatically; [] = every pass
                                 # (the self-test passes for now; finally "report")
stop_on_failure = false          # true: on the first failure, admit nothing new and cancel running passes

[resources]
# Admission (design §3.3): a ready pass starts when the running passes plus it fit both limits below.
# A pass declaring more than a limit by itself waits until nothing else runs, then runs alone.
# The two limits are the guardrail of a whole run on a shared server (here half the cores and a quarter of
# the memory of a 64-core, 500 GB machine); a host with less headroom lowers them in config.local.toml.
memory_budget_gb = 128           # sum of declared memory_gb of concurrently running passes
threads_total = 32               # sum of declared threads of concurrently running passes

[paths]
build_dir = "build"
models_dir = "models"
third_party_dir = "third_party"
# eda_toggle, scratch_dir, pdk paths: machine-specific, see config.local.toml.example

[models]
keys = "all"                     # "all" or a list of catalog keys, e.g. ["resnet50", "llama"]
config = "full"                  # "full" | "reduced"; analysis is abstract, so full is cheap

[testing]
deep_models = ["resnet50", "mobilenetv4_conv_m", "bert", "llama", "qwen3vl", "centerpoint", "sdxl"]
tiny_dim = 4                     # value given to symbolic dims for numeric checks (never model scale)
seed = 20261030

[tools.host]                     # HostRunner
watchdog_interval_s = 0.5        # RSS sampling period of the process-group watchdog

[tools.docker]                   # DockerRunner
image = "chiplet-compiler/toolchain"
tag = "0.4.0"                    # the release in which the image inputs ([tools.docker.build], the pins below,
                                 # docker/) last changed; bump it with them
memory_gb = 16                   # ceiling of one container (--memory and --memory-swap); a pass's
cpus = 8.0                       # containers share its declared memory_gb and threads, each at most this
pids_limit = 4096

[tools.docker.build]             # inputs of docker/build.sh only (`chipc doctor --build-args`)
ubuntu_2404 = "ubuntu@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852"  # final image
ubuntu_2204 = "ubuntu@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11"  # XLS Bazel stage
apt_snapshot = "20261030T000000Z"           # snapshot.ubuntu.com date: freezes every apt package
pypi_exclude_newer = "2026-10-30T00:00:00Z"  # uv --exclude-newer: freezes PyPI resolution
uv_version = "0.13.6"
uv_sha256 = "f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645"
bazelisk_version = "v1.30.0"     # Bazel itself comes from third_party/xls/.bazelversion
bazelisk_sha256 = "a248ae2b2b62b5baebb748f6fba7203bff1a27e5d01b55399a8406744cb539e8"
z3_version = "5.3.3"             # release build for glibc 2.39 (Ubuntu 24.04)
z3_sha256 = "d56f60b06f432f33de5810f7f1a384a339131f361e2d54d08ea83eea14326880"
bitwuzla_version = "0.9.1"       # static Linux binary
bitwuzla_sha256 = "057f1546ae2068df57beb178f3eeab1678f0e5f0c378787a05b7bb294617c9c6"
memory_gb = 64                   # docker build --memory = --memory-swap (hard cap of every RUN step)
cpus = 16                        # docker build CPU quota; also ninja -j and Bazel --jobs
link_jobs = 2                    # LLVM_PARALLEL_LINK_JOBS (links are the LLVM memory peak)
bazel_ram_mb = 49152             # Bazel --local_resources=memory (below memory_gb: JVM + headroom)

[tools.xls]                      # third_party/xls is checked out at `commit`
tag = "v0.0.0-10898-g8ddae8bf4"  # release whose tarball supplies codegen_main, opt_main, ...
commit = "8ddae8bf466742285aa2d405470512cc73a9aeec"
release_sha256 = "055b82894f747e5eca2bb3ba210be8f4d4827b57dadb2861935bd4ae809e4ca3"

[tools.allo]                     # third_party/allo is checked out at `commit`
commit = "ac21bae49ca5f912ecebea00908b56976d2361a2"
llvm_commit = "6b09f739c4d085dc39eb9ff220c786bc3aa8c7fb"  # = Allo's externals/llvm-project gitlink

[tools.grami]                    # third_party/grami is checked out at `commit`
commit = "d2875ae80afa2f141323a3f6b89a387787fcda38"

[tools.pdk]                      # Liberty sets compiled to .db by `chipc doctor` (build/.env/out/pdk_db/)
asap7_vt = "RVT"                 # LVT | RVT | SLVT | SRAM
asap7_corner = "TT"              # TT | FF | SS
asap7_groups = ["AO", "OA", "INVBUF", "SEQ", "SIMPLE"]  # all five, or the corner has no flops

[tools.eda]                      # host tools via eda-run
max_licenses = 2                 # concurrent EDA invocations (one shared semaphore)
watchdog_interval_s = 2          # RSS sampling period of the process-group watchdog
license_retries = 3              # extra attempts after a license failure (never a design failure)
license_backoff_s = 30           # first retry wait; doubles each attempt
# Output substrings that mean "no license". Synopsys Common Licensing message pages
# (syn/W-2024.09/doc/syn/man/catn/SEC/): SEC-12 server unreachable, SEC-21 checkout failed,
# SEC-50 all in use, SEC-85 communication failed, SEC-87 unable to obtain. Cadence: Genus message
# observed on this host 2026-10-30 (docs/tools/cadence.md §5).
license_error_patterns = [
  "(SEC-12)", "(SEC-21)", "(SEC-50)", "(SEC-85)", "(SEC-87)",
  "Unable to complete periodic license check",
]

[tools.smt]
solver = "bitwuzla"              # "bitwuzla" | "z3": proves; the other one re-checks in verify
timeout_s = 60                   # per query
runner = "docker"                # "docker": the solvers of [tools.docker]'s image | "host": the paths below
z3 = "z3"                        # host binaries (runner = "host"), resolved on PATH unless absolute
bitwuzla = "bitwuzla"

# ---------------------------------------------------------------------------------------------
# Passes. Section name == pass name == build/.<pass>/ directory.
# [passes.<pass>.resources]: threads (rayon pool size), memory_gb (admitted against the budget; caps the
# pass's tool calls), timeout_min (the pass is cancelled after it). Defaults: 4, 4, 60.
# ---------------------------------------------------------------------------------------------

# Framework self-test passes: hello_a -> hello_b, and hello_c independent. No model is touched.
[passes.hello_a]
greeting = "hello"               # text written to out/hello.a/greeting.json
sleep_ms = 0                     # artificial work time (overlap test)
[passes.hello_a.resources]
threads = 1
memory_gb = 1
timeout_min = 1

[passes.hello_b]
suffix = ", world"               # appended to hello_a's greeting
sleep_ms = 0
fail = false                     # true: induce a failure (failure propagation / resume test)
[passes.hello_b.resources]
threads = 1
memory_gb = 1
timeout_min = 1

[passes.hello_c]
text = "independent"             # echoed through the HostRunner (/bin/echo)
sleep_ms = 0
[passes.hello_c.resources]
threads = 1
memory_gb = 1
timeout_min = 1

[passes.export]                  # JAX -> StableHLO + component composites + symbolic sizes + JSON
runner = "docker"                # "docker" (toolchain image) | "host" (uv-managed env from uv.lock; CI)
exclude_classes = []             # module class names never wrapped as composites (children still are)
docker_python = "/opt/cc/jax-venv/bin/python"        # the locked JAX stack inside the image
host_python = ["uv", "run", "--frozen", "python"]    # host command prefix
# Input sizes are always symbolic and the invariance re-export always runs: there is no switch.
[passes.export.resources]
threads = 12                     # models exported in parallel, one process each
memory_gb = 72                   # each model process gets memory_gb / threads (largest measured: 3.4 GB)
timeout_min = 60

[passes.import]
inline_composites = ["chlo.*"]   # composites inlined like calls (not component boundaries); `*` = prefix.
                                 # JAX's own composites (chlo.top_k, chlo.erf, …) are not module boundaries
views = true                     # write views/<model>/<phase>.dot (entry function, composites collapsed)
[passes.import.resources]
threads = 8                      # phases imported in parallel
memory_gb = 8                    # measured 2026-11-01: 4.4 GB peak for all models at full (largest phase 1.2 GB)
timeout_min = 30

[passes.components]
wl_max_rounds = 64               # upper bound on WL refinement rounds (stops earlier once the colours are stable)
vf2_budget = 200000000           # candidate pairs one VF2 search may test; a search over it fails the pass
views = true                     # write views/components.md (components x models)
[passes.components.resources]
threads = 8                      # phases in parallel
memory_gb = 8                    # measured 2026-11-01: 3.3 GB peak for all models at full (run + verify)
timeout_min = 30

[passes.normalize]
views = true                     # write views/normalize.md
[passes.normalize.order]         # reduction order ω per dtype family: "seq" | "tree:<fan-in>" (fan-in >= 2)
bool = "seq"                     # integer families default to "seq" (every order gives the same bits)
sint = "seq"
uint = "seq"
float = "seq"                    # float families must be set: their order is part of the semantics
complex = "seq"
[passes.normalize.resources]
threads = 8
memory_gb = 8                    # solver jobs share it (one per thread)
timeout_min = 30

[passes.kernels]
views = true                     # write views/kernels.md and views/<component>.dot
[passes.kernels.resources]
threads = 8
memory_gb = 2
timeout_min = 30

[passes.kernel_classes]
wl_max_rounds = 64               # upper bound on WL refinement rounds (stops earlier when stable)
vf2_budget = 200000000           # candidate pairs one VF2 search may test; over it the pass fails
views = true                     # write views/sharing.md and views/classes.md
[passes.kernel_classes.resources]
threads = 16
memory_gb = 4
timeout_min = 30

[passes.iteration_space]
views = true                     # write views/routing.md and views/iteration_space.md
[passes.iteration_space.template]
enabled = true                   # route uniform contractions with a valid space-time mapping to array templates
min_reuse = 8                    # a row counts when each core input is reused >= this many times (MACs per element)
min_share = 0.5                  # ... and such rows must hold >= this share of the class's weighted workload
max_dims = 7                     # bound on the dims of the space-time mapping search (after grouping: at most 3)
[passes.iteration_space.resources]
threads = 8
memory_gb = 8                    # solver jobs share it (one per thread)
timeout_min = 30

[passes.datapaths]
allow_unknown = []               # [{ class = "z…", reason = "…" }]: classes allowed to end "unknown"/timeout
max_tuples = 64                  # width tuples one class may have (more fails the pass)
lemma_timeout_s = 600            # per encoding lemma (Z3; bf16 division takes about 100 s)
views = true                     # write views/datapaths.md
[passes.datapaths.resources]
threads = 24                     # proofs in parallel (solver jobs)
memory_gb = 48                   # solver jobs share it: 2 GB each
timeout_min = 120

[passes.characterize]            # needs `chipc doctor` (build/.env: the .db files, the merged ASAP7 Liberty)
tool = "dc"                      # "dc" (+ Formality) | "genus" (+ Conformal) | "yosys" (+ its equiv flow, no license)
pdks = ["nangate45", "asap7"]
clock_ps = { nangate45 = 2000, asap7 = 1000 }
targets = ["clock", "fast"]      # clock: the area row at the clock target; fast: a tight constraint
fast_fraction = 0.05             # the fast period as a fraction of the clock target
ops = []                         # element-wise ops of the catalog; [] = every op of the op table
int_widths = [2, 4, 8, 16, 32]   # signed and unsigned integer widths (bool is the 1-bit type)
float_formats = ["f32", "f16", "bf16", "f8e4m3fn"]   # RTL from XLS apfloat, provisional until softfloat
mux_inputs = [2, 3, 4, 5, 6, 7, 8]
mux_widths = [1, 2, 4, 8, 16, 32]
register_widths = [1, 2, 4, 8, 16, 32]
split_multipliers = [[8, 4], [16, 8], [32, 8], [32, 16]]   # (w, n): a w-bit multiply from n-bit pieces
driving_cell = { nangate45 = "BUF_X1", asap7 = "BUFx2_ASAP7_75t_R" }   # drives every input
load_fanout = 4                  # every output drives this many driving-cell inputs
lec_timeout_min = 2              # equivalence check limit per design (Formality verification_timeout_limit, Yosys);
                                 # a check that runs out of time with no failing point passes when every sanity
                                 # check does, and the row is marked inconclusive
lec_strategies = []              # Formality alternate strategies (s2, s3, …) tried while a design is not proven;
                                 # none proved a wide divider (s2, s3, s1 on divide@ui32), so none by default
batch = 24                       # designs per tool session (a job directory, reused by a rerun)
cores = 2                        # cores per DC / Genus session
views = true                     # write views/library.md
[passes.characterize.resources]
threads = 2                      # parallel tool sessions (each also holds one of tools.eda.max_licenses)
memory_gb = 8
timeout_min = 600

[passes.mine]                     # GraMi per family (map, reduce, contraction, template stages)
tau_start = 40                    # first MNI support threshold; the sweep halves it
tau_min = 2                       # last threshold
max_vertices = 6                  # pattern size bound (GraMi maxNodes); map at 8 takes hours, at 6 about 11 min
top_k = 32                        # patterns selected per family, by score
budget_s = 3600                   # GraMi wall clock per family (safety net; hitting it is recorded)
run_timeout_s = 600               # one GraMi run
heap_gb = 6                       # Java heap of one run; its container gets heap_gb + 2
vf2_budget = 100000000            # candidate pairs of one re-match (one pattern in one datapath)
views = true                      # write views/mine.md
[passes.mine.mis]
algorithm = "exact_ilp"          # "exact_ilp" | "branch_and_bound" | "greedy_min_degree"
node_budget = 1000000             # branch_and_bound search nodes per component
[passes.mine.resources]
threads = 8
memory_gb = 32                   # GraMi runs in parallel: memory_gb / (heap_gb + 2)
timeout_min = 120

[passes.merge]                    # functional units: datapath merging (compatibility graph + max-weight clique), arrays
requant_variant = "recipe"       # "recipe" | "fp32" | "fixed": "fixed" turns every rescaling chain (convert to f32,
                                 # times a scale, round) into one integer `rescale` block where its tolerance lemma
                                 # holds; every recipe rescales in fp32, so "recipe" is "fp32"
requant_timeout_s = 1800         # limit of one `rescale` tolerance lemma
target_units = 0                 # stop a family at this many units; 0 = stop when no merge saves area
max_logic_depth = 0              # critical-path bound in ps; 0 = per family, the deepest single unit rounded up to
                                 # whole clock periods of `kit` (merging adds no pipeline stage)
kit = "asap7"                    # library kit that prices merges: area at its `clock` target, delay at `fast`
contract = true                  # cover units with mine's selected patterns first; an occurrence merges only with
                                 # an occurrence of the same pattern
max_compat_nodes = 4000          # larger compatibility graphs are solved by `greedy`
certify_max_nodes = 60           # steps with at most this many nodes store their graph (verify re-solves them)
compose_timeout_s = 600          # Z3 limit per composed array step (a multiplier vs its pieces)
views = true                     # write views/merge.md
[passes.merge.clique]
algorithm = "exact_ilp"          # "exact_ilp" (microlp) | "ostergard" | "greedy"
rank = "greedy"                  # rank candidate pairs by "greedy" cliques (the accepted merge is solved by
                                 # `algorithm`) or by "algorithm" itself (an exact solve per candidate)
node_budget = 2000               # branch-and-bound nodes per solve (deterministic); then the incumbent, not optimal
timeout_s = 30                   # wall-clock limit per solve (safety net); on expiry `greedy` answers
[passes.merge.resources]
threads = 16
memory_gb = 32                   # solver jobs share it: 2 GB each
timeout_min = 240

[passes.softfloat]
float_formats = ["f32", "f16", "bf16", "f8e4m3fn"]   # as characterize's; add "f8e5m2" if a recipe needs it
int_widths = [2, 4, 8, 16, 32]   # integer types conversions reach (as characterize's)
ops = []                         # element-wise ops to build; empty: every float op of the catalog
exhaustive_bits = 16             # every input combination when the operands have at most this many bits
random_vectors = 100000          # otherwise seeded random operands per primitive, next to the edge cases
batch = 8                        # primitives per container
proof_timeout_s = 600            # Bitwuzla per proof; past it a primitive is `exhaustive` or `tested`
recheck_timeout_s = 1800         # Z3 per proof in verify (re-checks the proven ones)
recheck_sample = 2000            # vectors per primitive whose reference verify recomputes
docker_python = "python"
views = true
[passes.softfloat.resources]
threads = 16                     # containers (builds, solver jobs) in parallel
memory_gb = 64                   # 4 GB per container (Z3 needs about 1 GB on the hardest query)
timeout_min = 120

[passes.allo_emit]
[passes.allo_emit.resources]
threads = 4
memory_gb = 4
timeout_min = 120

[passes.xls]
delay_model = "asap7"
clock_period_ps = 1000
[passes.xls.resources]
threads = 4
memory_gb = 4
timeout_min = 120

[passes.rtl_verify]
simulator = "verilator"          # "verilator" | "iverilog" | "vcs" | "xcelium"
[passes.rtl_verify.resources]
threads = 4
memory_gb = 4
timeout_min = 120

[passes.synth]
tool = "dc"                      # "dc" | "genus"
lec = "formality"                # "formality" | "conformal"
sta = true
[passes.synth.resources]
threads = 2
memory_gb = 8
timeout_min = 240

[passes.report]
[passes.report.resources]
threads = 1
memory_gb = 1
timeout_min = 10
