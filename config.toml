# chiplet-compiler configuration (tracked defaults).
# Machine-specific paths and overrides go in config.local.toml (untracked; see config.local.toml.example).
# Every pass reads only [passes.<pass>] and [passes.<pass>.resources]. Unknown keys are an error.
# Merge order: built-in defaults < config.toml < config.local.toml < `chipc --set key=value`.
# A [passes.<name>] section whose pass is not implemented yet only warns: the sections of planned passes
# document their intended keys and may still change.

[pipeline]
max_parallel_passes = 2          # passes running at once (subject to the budgets below)
targets = ["hello_b", "hello_c"] # passes to reach; dependencies are pulled in automatically; [] = every pass
                                 # (the self-test passes for now; finally "report")
stop_on_failure = false          # true: on the first failure, admit nothing new and cancel running passes

[resources]
# Admission (design §3.3): a ready pass starts when the running passes plus it fit both limits below.
# A pass declaring more than a limit by itself waits until nothing else runs, then runs alone.
memory_budget_gb = 32            # sum of declared memory_gb of concurrently running passes
threads_total = 16               # sum of declared threads of concurrently running passes

[paths]
build_dir = "build"
models_dir = "models"
third_party_dir = "third_party"
# eda_toggle, scratch_dir, pdk paths: machine-specific, see config.local.toml.example

[models]
keys = "all"                     # "all" or a list of catalog keys, e.g. ["resnet50", "llama"]
config = "full"                  # "full" | "reduced"; analysis is abstract, so full is cheap

[testing]
deep_models = ["resnet50", "mobilenetv4_conv_m", "bert", "llama", "qwen3vl", "centerpoint", "sdxl"]
tiny_dim = 4                     # value given to symbolic dims for numeric checks (never model scale)
seed = 20261030

[tools.host]                     # HostRunner
watchdog_interval_s = 0.5        # RSS sampling period of the process-group watchdog

[tools.docker]                   # DockerRunner
image = "chiplet-compiler/toolchain"
tag = "0.3.0"                    # the release in which the image inputs ([tools.docker.build], the pins below,
                                 # docker/) last changed; bump it with them
memory_gb = 8                    # default per-call cap (--memory and --memory-swap)
cpus = 4.0                       # default per-call --cpus
pids_limit = 4096

[tools.docker.build]             # inputs of docker/build.sh only (`chipc doctor --build-args`)
ubuntu_2404 = "ubuntu@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852"  # final image
ubuntu_2204 = "ubuntu@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11"  # XLS Bazel stage
apt_snapshot = "20261030T000000Z"           # snapshot.ubuntu.com date: freezes every apt package
pypi_exclude_newer = "2026-10-30T00:00:00Z"  # uv --exclude-newer: freezes PyPI resolution
uv_version = "0.13.6"
uv_sha256 = "f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645"
bazelisk_version = "v1.30.0"     # Bazel itself comes from third_party/xls/.bazelversion
bazelisk_sha256 = "a248ae2b2b62b5baebb748f6fba7203bff1a27e5d01b55399a8406744cb539e8"
z3_version = "5.3.3"             # release build for glibc 2.39 (Ubuntu 24.04)
z3_sha256 = "d56f60b06f432f33de5810f7f1a384a339131f361e2d54d08ea83eea14326880"
bitwuzla_version = "0.9.1"       # static Linux binary
bitwuzla_sha256 = "057f1546ae2068df57beb178f3eeab1678f0e5f0c378787a05b7bb294617c9c6"
memory_gb = 64                   # docker build --memory = --memory-swap (hard cap of every RUN step)
cpus = 16                        # docker build CPU quota; also ninja -j and Bazel --jobs
link_jobs = 2                    # LLVM_PARALLEL_LINK_JOBS (links are the LLVM memory peak)
bazel_ram_mb = 49152             # Bazel --local_resources=memory (below memory_gb: JVM + headroom)

[tools.xls]                      # third_party/xls is checked out at `commit`
tag = "v0.0.0-10898-g8ddae8bf4"  # release whose tarball supplies codegen_main, opt_main, ...
commit = "8ddae8bf466742285aa2d405470512cc73a9aeec"
release_sha256 = "055b82894f747e5eca2bb3ba210be8f4d4827b57dadb2861935bd4ae809e4ca3"

[tools.allo]                     # third_party/allo is checked out at `commit`
commit = "ac21bae49ca5f912ecebea00908b56976d2361a2"
llvm_commit = "6b09f739c4d085dc39eb9ff220c786bc3aa8c7fb"  # = Allo's externals/llvm-project gitlink

[tools.grami]                    # third_party/grami is checked out at `commit`
commit = "d2875ae80afa2f141323a3f6b89a387787fcda38"

[tools.pdk]                      # Liberty sets compiled to .db by `chipc doctor` (build/.env/out/pdk_db/)
asap7_vt = "RVT"                 # LVT | RVT | SLVT | SRAM
asap7_corner = "TT"              # TT | FF | SS
asap7_groups = ["AO", "OA", "INVBUF", "SEQ", "SIMPLE"]  # all five, or the corner has no flops

[tools.eda]                      # host tools via eda-run
max_licenses = 2                 # concurrent EDA invocations (one shared semaphore)
watchdog_interval_s = 2          # RSS sampling period of the process-group watchdog
license_retries = 3              # extra attempts after a license failure (never a design failure)
license_backoff_s = 30           # first retry wait; doubles each attempt
# Output substrings that mean "no license". Synopsys Common Licensing message pages
# (syn/W-2024.09/doc/syn/man/catn/SEC/): SEC-12 server unreachable, SEC-21 checkout failed,
# SEC-50 all in use, SEC-85 communication failed, SEC-87 unable to obtain. Cadence: Genus message
# observed on this host 2026-10-30 (docs/tools/cadence.md §5).
license_error_patterns = [
  "(SEC-12)", "(SEC-21)", "(SEC-50)", "(SEC-85)", "(SEC-87)",
  "Unable to complete periodic license check",
]

[tools.smt]
solver = "bitwuzla"              # "bitwuzla" | "z3": proves; the other one re-checks in verify
timeout_s = 60                   # per query
runner = "docker"                # "docker": the solvers of [tools.docker]'s image | "host": the paths below
z3 = "z3"                        # host binaries (runner = "host"), resolved on PATH unless absolute
bitwuzla = "bitwuzla"

# ---------------------------------------------------------------------------------------------
# Passes. Section name == pass name == build/.<pass>/ directory.
# [passes.<pass>.resources]: threads (rayon pool size), memory_gb (admitted against the budget; caps the
# pass's tool calls), timeout_min (the pass is cancelled after it). Defaults: 4, 4, 60.
# ---------------------------------------------------------------------------------------------

# Framework self-test passes: hello_a -> hello_b, and hello_c independent. No model is touched.
[passes.hello_a]
greeting = "hello"               # text written to out/hello.a/greeting.json
sleep_ms = 0                     # artificial work time (overlap test)
[passes.hello_a.resources]
threads = 1
memory_gb = 1
timeout_min = 1

[passes.hello_b]
suffix = ", world"               # appended to hello_a's greeting
sleep_ms = 0
fail = false                     # true: induce a failure (failure propagation / resume test)
[passes.hello_b.resources]
threads = 1
memory_gb = 1
timeout_min = 1

[passes.hello_c]
text = "independent"             # echoed through the HostRunner (/bin/echo)
sleep_ms = 0
[passes.hello_c.resources]
threads = 1
memory_gb = 1
timeout_min = 1

[passes.export]                  # JAX -> StableHLO + component composites + symbolic sizes + JSON
runner = "docker"                # "docker" (toolchain image) | "host" (uv-managed env from uv.lock; CI)
exclude_classes = []             # module class names never wrapped as composites (children still are)
docker_python = "/opt/cc/jax-venv/bin/python"        # the locked JAX stack inside the image
host_python = ["uv", "run", "--frozen", "python"]    # host command prefix
# Input sizes are always symbolic and the invariance re-export always runs: there is no switch.
[passes.export.resources]
threads = 4                      # models exported in parallel, one process each
memory_gb = 32                   # declared for admission; each model process gets memory_gb / threads
timeout_min = 60

[passes.import]
inline_composites = ["chlo.*"]   # composites inlined like calls (not component boundaries); `*` = prefix.
                                 # JAX's own composites (chlo.top_k, chlo.erf, …) are not module boundaries
views = true                     # write views/<model>/<phase>.dot (entry function, composites collapsed)
[passes.import.resources]
threads = 8                      # phases imported in parallel
memory_gb = 8                    # measured 2026-11-01: 4.4 GB peak for all models at full (largest phase 1.2 GB)
timeout_min = 30

[passes.components]
wl_max_rounds = 64               # upper bound on WL refinement rounds (stops earlier once the colours are stable)
vf2_budget = 200000000           # candidate pairs one VF2 search may test; a search over it fails the pass
views = true                     # write views/components.md (components x models)
[passes.components.resources]
threads = 8                      # phases in parallel
memory_gb = 4                    # measured 2026-11-01: 3.3 GB peak for all models at full (run + verify)
timeout_min = 30

[passes.normalize]
views = true                     # write views/normalize.md
[passes.normalize.order]         # reduction order ω per dtype family: "seq" | "tree:<fan-in>" (fan-in >= 2)
bool = "seq"                     # integer families default to "seq" (every order gives the same bits)
sint = "seq"
uint = "seq"
float = "seq"                    # float families must be set: their order is part of the semantics
complex = "seq"
[passes.normalize.resources]
threads = 8
memory_gb = 2
timeout_min = 30

[passes.kernels]
views = true                     # write views/kernels.md and views/<component>.dot
[passes.kernels.resources]
threads = 8
memory_gb = 2
timeout_min = 30

[passes.kernel_classes]
wl_iterations = 3
[passes.kernel_classes.resources]
threads = 16
memory_gb = 4
timeout_min = 30

[passes.iteration_space]
[passes.iteration_space.template]
enabled = true
min_reuse = 8                    # minimum reuse factor for routing a class to an array template
max_dims = 7                     # bound of the space-time mapping search
[passes.iteration_space.resources]
threads = 8
memory_gb = 2
timeout_min = 30

[passes.datapaths]
allow_unknown = []               # classes allowed to end with solver "unknown" (with a reason)
[passes.datapaths.resources]
threads = 16
memory_gb = 8
timeout_min = 120

[passes.characterize]
tool = "dc"                      # "dc" | "genus"
pdks = ["nangate45", "asap7"]
clock_ps = { nangate45 = 2000, asap7 = 1000 }
[passes.characterize.resources]
threads = 2                      # bounded by tools.eda.max_licenses
memory_gb = 8
timeout_min = 240

[passes.mine]
tau_start = 40
tau_min = 2
budget_s = 3600
top_k = 32
[passes.mine.mis]
algorithm = "exact_ilp"          # "exact_ilp" | "branch_and_bound" | "greedy_min_degree"
[passes.mine.resources]
threads = 8
memory_gb = 8
timeout_min = 120

[passes.merge]
requant_variant = "recipe"       # "recipe" | "fp32" | "fixed"
target_units = 0                 # 0 = stop when area gain <= 0
max_logic_depth = 0              # 0 = derive from the clock target and the characterize library
[passes.merge.clique]
algorithm = "exact_ilp"          # "exact_ilp" | "ostergard" | "greedy"
timeout_s = 300
[passes.merge.resources]
threads = 8
memory_gb = 8
timeout_min = 240

[passes.softfloat]
formats = ["e4m3fn", "bf16", "fp16", "fp32"]   # add "e5m2" if a recipe needs it (none does today)
subnormals = "ieee"              # "ieee" | "ftz"
random_vectors = 100000
[passes.softfloat.resources]
threads = 8
memory_gb = 4
timeout_min = 120

[passes.allo_emit]
[passes.allo_emit.resources]
threads = 4
memory_gb = 4
timeout_min = 120

[passes.xls]
delay_model = "asap7"
clock_period_ps = 1000
[passes.xls.resources]
threads = 4
memory_gb = 4
timeout_min = 120

[passes.rtl_verify]
simulator = "verilator"          # "verilator" | "iverilog" | "vcs" | "xcelium"
[passes.rtl_verify.resources]
threads = 4
memory_gb = 4
timeout_min = 120

[passes.synth]
tool = "dc"                      # "dc" | "genus"
lec = "formality"                # "formality" | "conformal"
sta = true
[passes.synth.resources]
threads = 2
memory_gb = 8
timeout_min = 240

[passes.report]
[passes.report.resources]
threads = 1
memory_gb = 1
timeout_min = 10
