# CI (design §9; docs/tools/ci.md). Merges to main require both jobs, `lint` and `test`, to pass.
# Deep tests (Docker toolchain, licensed EDA tools) run on the build host, not here.
name: ci

on:
  push:
    branches: [main]               # branches are checked by their pull request: one lint and one test per PR
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CC_TYPES: feat|fix|docs|test|refactor|perf|build|ci|chore|revert
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false            # no third-party sources in CI
          fetch-depth: 0

      - name: Pull request title is a conventional commit
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re="^(${CC_TYPES})(\([a-z0-9._/-]+\))?!?: [^ ].*[^.]$"
          if [[ ! "$TITLE" =~ $re ]] || [ "${#TITLE}" -gt 72 ]; then
            echo "::error::PR title must be 'type(scope): subject', at most 72 characters: $TITLE"
            exit 1
          fi

      - name: Commit subjects are conventional commits
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$PR_BASE"
          re="^(${CC_TYPES})(\([a-z0-9._/-]+\))?!?: [^ ].*[^.]$"
          bad=0
          while IFS= read -r subject; do
            if [[ ! "$subject" =~ $re ]] || [ "${#subject}" -gt 72 ]; then
              echo "::error::not a conventional commit subject: $subject"
              bad=1
            fi
          done < <(git log --no-merges --format=%s "$base..HEAD")
          exit "$bad"

      - name: Changelog updated for user-visible changes
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$TITLE" =~ ^(feat|fix)(\(|!|:) ]] || [[ "$TITLE" =~ ^[a-z]+(\([^\)]*\))?!: ]]; then
            if ! git diff --name-only "$BASE...$HEAD" | grep -qx CHANGELOG.md; then
              echo "::error::feat, fix and breaking changes must add a line to CHANGELOG.md"
              exit 1
            fi
          fi

      - name: No em-dash characters
        run: |
          if git grep -nP '\x{2014}' -- . ':(exclude,glob)models/*/upstream/**' ':(exclude)tests/fixtures/liberty'; then
            echo "::error::replace the em-dash characters above"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"          # same as rust-toolchain.toml
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2   # after the toolchain step: its key includes the rustc version
        with:
          shared-key: workspace
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      JAX_PLATFORMS: cpu
      KERAS_BACKEND: jax
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: install hadolint (pinned, checksummed; smoke test env::dockerfile_lints_clean)
        run: |
          curl -fsSLo /usr/local/bin/hadolint https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
          echo "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507  /usr/local/bin/hadolint" | sha256sum -c -
          chmod +x /usr/local/bin/hadolint
      - name: install z3 and bitwuzla (the image's pins, checksummed; smoke test normalize::ci_solver_pins_match_the_config)
        run: |
          d="$RUNNER_TEMP/solvers"; mkdir -p "$d/bin"
          curl -fsSLo "$d/z3.zip" https://github.com/Z3Prover/z3/releases/download/z3-5.3.3/z3-5.3.3-x64-glibc-2.39.zip
          echo "d56f60b06f432f33de5810f7f1a384a339131f361e2d54d08ea83eea14326880  $d/z3.zip" | sha256sum -c -
          curl -fsSLo "$d/bitwuzla.zip" https://github.com/bitwuzla/bitwuzla/releases/download/0.9.1/Bitwuzla-Linux-x86_64-static.zip
          echo "057f1546ae2068df57beb178f3eeab1678f0e5f0c378787a05b7bb294617c9c6  $d/bitwuzla.zip" | sha256sum -c -
          unzip -q "$d/z3.zip" -d "$d/z3" && cp "$d"/z3/z3-*/bin/z3 "$d/bin/"
          unzip -q "$d/bitwuzla.zip" -d "$d/bitwuzla" && find "$d/bitwuzla" -type f -name bitwuzla -exec cp {} "$d/bin/" \;
          chmod 0755 "$d"/bin/* && "$d/bin/z3" --version && "$d/bin/bitwuzla" --version
          echo "$d/bin" >> "$GITHUB_PATH"
          echo "CC_SMT_RUNNER=host" >> "$GITHUB_ENV"
      - run: cargo nextest run --workspace --profile smoke
      # setup-uv publishes no moving major tag (`v10` does not resolve): pin the release commit.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.21"           # same uv as the build host
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --frozen python -m pytest verify/test_quant.py -q
      # The exporter on toy Flax / Haiku / Keras ports (abstract tracing + tiny-size checks).
      - run: uv run --frozen python -m pytest python/tests -q
