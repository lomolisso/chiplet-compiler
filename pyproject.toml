[project]
name = "dnn-graph-decomp"
version = "0.1.0"
description = "JAX ports of the DNN workload set"
requires-python = ">=3.12,<3.13"
dependencies = [
  # JAX
  "jax==0.12.0",
  "jaxlib==0.12.0",
  "flax==0.12.10",
  "numpy==2.5.4",
  # upstream JAX libraries run by some ports (vendored in models/*/upstream/)
  "dm-haiku==0.0.17",       # alphafold2, graphcast
  "ml-collections==1.1.0",  # alphafold2
  "dm-tree==0.1.10",        # alphafold2
  "jraph==0.0.6.dev0",      # graphcast
  "chex==0.1.92",           # graphcast
  "xarray==2026.2.0",       # graphcast
  "pandas==3.0.6",          # graphcast (xarray)
  "scipy==1.18.1",          # graphcast
  "trimesh==5.1.1",         # graphcast
  "rtree==1.4.1",           # graphcast
  "etils==1.14.0",          # gemma4
  "einops==0.8.2",          # gemma4
  "sentencepiece==0.2.2",   # gemma4
  "keras==3.15.1",          # dlrm
  "keras-rs==0.4.0",        # dlrm
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
